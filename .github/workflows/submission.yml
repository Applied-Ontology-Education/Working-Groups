name: Working group submission
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  create-proposal:
    if: startsWith(github.event.issue.title, '[New group]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check out only trusted code from the repository's default branch.
      # No issue content or contributor-controlled branch is executed.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate proposal and create pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/issue-to-pr.mjs
